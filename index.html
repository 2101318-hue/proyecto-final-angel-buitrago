<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Real Madrid - Jugadores SPA</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header>

        <div class="logo">

            <img
                src="https://api-deportivas.com/wp-content/uploads/2023/06/soccer-500x500-1.jpg"
                alt="Real Madrid">

            <div>

                <h1>Real Madrid</h1>

                <p>Jugadores SPA</p>

            </div>

        </div>


        <!-- ========================= -->
        <!-- BUSCADOR -->
        <!-- ========================= -->

        <div class="search">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar jugador..."
            >

            <button id="searchButton">

                Buscar

            </button>

        </div>

    </header>


    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main>


        <!-- ========================= -->
        <!-- LISTA DE JUGADORES -->
        <!-- ========================= -->

        <section class="pokemon-list">

            <div class="section-title">

                <h2>Jugadores</h2>

                <span id="pokemonCounter">

                    0 jugadores

                </span>

            </div>


            <!-- ========================= -->
            <!-- CONTENEDOR -->
            <!-- ========================= -->

            <div id="pokemonContainer">

                <!-- Los jugadores serán creados
                     mediante JavaScript -->

            </div>


            <!-- ========================= -->
            <!-- PAGINACIÓN -->
            <!-- ========================= -->

            <div class="pagination">

                <button id="previousBtn">

                    ⬅ Anterior

                </button>

                <button id="nextBtn">

                    Siguiente ➜

                </button>

            </div>

        </section>


        <!-- ========================= -->
        <!-- DETALLE -->
        <!-- ========================= -->

        <aside class="pokemon-detail">

            <div id="detailContainer">

                <img
                    src="https://api-deportivas.com/wp-content/uploads/2023/06/soccer-500x500-1.jpg"
                    alt="Real Madrid"
                >

                <h2>

                    Real Madrid

                </h2>

                <p>

                    Selecciona un jugador para
                    ver su información.

                </p>

            </div>

        </aside>

    </main>


    <!-- ========================= -->
    <!-- LOADING -->
    <!-- ========================= -->

    <div id="loading" class="hidden">

        <div class="loader"></div>

        <p>

            Cargando jugadores...

        </p>

    </div>


    <!-- ========================= -->
    <!-- ERROR -->
    <!-- ========================= -->

    <div id="errorMessage"
         class="hidden">

        Jugador no encontrado.

    </div>


    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer>

        <p>

            Proyecto SPA - Real Madrid

        </p>

        <p>

            HTML • CSS • JavaScript • Fetch API • JSON

        </p>

    </footer>


    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="script.js"></script>

</body>

</html>
```
